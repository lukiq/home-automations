script:
  # One entry point for sensors and the existing HA direction switches.
  - id: stairs_up_request_motion
    mode: single
    parameters:
      down_to_up: bool
    then:
      - if:
          condition:
            switch.is_off: SwitchStairsUpSensorsDisabled
          then:
            - script.stop: stairs_up_off_timer
            - if:
                condition:
                  and:
                    - not:
                        script.is_running: script_turn_on_steps_down_to_up
                    - not:
                        script.is_running: script_turn_on_steps_up_to_down
                    # Use the requested state: an explicit off may still be fading.
                    - lambda: 'return !id(stairs_up).remote_values.is_on();'
                then:
                  - if:
                      condition:
                        lambda: 'return down_to_up;'
                      then:
                        - script.execute: script_turn_on_steps_down_to_up
                      else:
                        - script.execute: script_turn_on_steps_up_to_down
            - script.execute: stairs_up_off_timer

  # Start the hold only after the complete animation and the last sensor release.
  - id: stairs_up_off_timer
    mode: restart
    then:
      - wait_until:
          and:
            - binary_sensor.is_off: stairs_up_sensor_first
            - binary_sensor.is_off: stairs_up_sensor_last
            - not:
                script.is_running: script_turn_on_steps_down_to_up
            - not:
                script.is_running: script_turn_on_steps_up_to_down
      - delay: !lambda 'return id(delay_after_animation_s).state * 1000;'
      - if:
          condition:
            and:
              - switch.is_off: SwitchStairsUpSensorsDisabled
              - binary_sensor.is_off: stairs_up_sensor_first
              - binary_sensor.is_off: stairs_up_sensor_last
          then:
            - script.execute: script_turn_off_stairs_up

  - id: script_turn_off_stairs_up
    mode: single
    then:
      - script.stop: stairs_up_off_timer
      - script.stop: script_turn_on_steps_down_to_up
      - script.stop: script_turn_on_steps_up_to_down
      - light.turn_off:
          id: stairs_up_step16
          transition_length: 10ms
      - light.turn_off:
          id: stairs_up_step15
          transition_length: 10ms
      - light.turn_off:
          id: stairs_up_step14
          transition_length: 10ms
      - light.turn_off:
          id: stairs_up_step13
          transition_length: 10ms
      - light.turn_off:
          id: stairs_up_step12
          transition_length: 10ms
      - light.turn_off:
          id: stairs_up_step11
          transition_length: 10ms
      - light.turn_off:
          id: stairs_up_step10
          transition_length: 10ms
      - light.turn_off:
          id: stairs_up_step9
          transition_length: 10ms
      - light.turn_off:
          id: stairs_up_step8
          transition_length: 10ms
      - light.turn_off:
          id: stairs_up_step7
          transition_length: 10ms
      - light.turn_off:
          id: stairs_up_step6
          transition_length: 10ms
      - light.turn_off:
          id: stairs_up_step5
          transition_length: 10ms
      - light.turn_off:
          id: stairs_up_step4
          transition_length: 10ms
      - light.turn_off:
          id: stairs_up_step3
          transition_length: 10ms
      - light.turn_off:
          id: stairs_up_step2
          transition_length: 10ms
      - light.turn_off:
          id: stairs_up_step1
          transition_length: 10ms
      - light.turn_off:
          id: stairs_up
          transition_length: 100ms

  - id: script_turn_on_steps_down_to_up
    mode: single
    then:
      - light.turn_off:
          id: stairs_up
          transition_length: 10ms
      - light.turn_on:
          id: stairs_up_step16
          transition_length: 10ms
          red: !lambda 'return id(stairs_up_red).state;'
          green: !lambda 'return id(stairs_up_green).state;'
          blue: !lambda 'return id(stairs_up_blue).state;'
          brightness: !lambda 'return id(stairs_up_brightness).state;'
      - delay: !lambda 'return id(animation_delay_down_to_up_ms).state;'
      - light.turn_on:
          id: stairs_up_step15
          transition_length: 10ms
          red: !lambda 'return id(stairs_up_red).state;'
          green: !lambda 'return id(stairs_up_green).state;'
          blue: !lambda 'return id(stairs_up_blue).state;'
          brightness: !lambda 'return id(stairs_up_brightness).state;'
      - delay: !lambda 'return id(animation_delay_down_to_up_ms).state;'
