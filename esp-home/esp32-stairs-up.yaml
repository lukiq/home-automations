substitutions:
  default_red: "1.00"
  default_green: "0.87"
  default_blue: "0.50"
  default_brightness: "0.55"
  default_delay_after_animation_s: "20"
  default_animation_delay_up_to_down_ms: "400"
  default_animation_delay_down_to_up_ms: "250"

esphome:
  name: "esp32-stairs-up"
  friendly_name: esp32 Stairs Up

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key_stairs_up

ota:
  platform: esphome
  password: !secret ota_password_stairs_up

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Stairs up Fallback Hotspot"
    password: !secret ap_password_fallback

captive_portal:

# Color and brightness controls — adjustable from HA
number:
  - platform: template
    name: "Stairs Up Red"
    id: stairs_up_red
    min_value: 0
    max_value: 1
    step: 0.01
    initial_value: ${default_red}
    optimistic: true
    restore_value: true
  - platform: template
    name: "Stairs Up Green"
    id: stairs_up_green
    min_value: 0
    max_value: 1
    step: 0.01
    initial_value: ${default_green}
    optimistic: true
    restore_value: true
  - platform: template
    name: "Stairs Up Blue"
    id: stairs_up_blue
    min_value: 0
    max_value: 1
    step: 0.01
    initial_value: ${default_blue}
    optimistic: true
    restore_value: true
  - platform: template
    name: "Stairs Up Brightness"
    id: stairs_up_brightness
    min_value: 0
    max_value: 1
    step: 0.01
    initial_value: ${default_brightness}
    optimistic: true
    restore_value: true
  - platform: template
    name: "Stairs Up Delay After Animation"
    id: delay_after_animation_s
    min_value: 5
    max_value: 60
    step: 1
    unit_of_measurement: "s"
    initial_value: ${default_delay_after_animation_s}
    optimistic: true
    restore_value: true
  - platform: template
    name: "Stairs Up Animation Delay Up To Down"
    id: animation_delay_up_to_down_ms
    min_value: 100
    max_value: 1000
    step: 50
    unit_of_measurement: "ms"
    initial_value: ${default_animation_delay_up_to_down_ms}
    optimistic: true
    restore_value: true
  - platform: template
    name: "Stairs Up Animation Delay Down To Up"
    id: animation_delay_down_to_up_ms
    min_value: 100
    max_value: 1000
    step: 50
    unit_of_measurement: "ms"
    initial_value: ${default_animation_delay_down_to_up_ms}
    optimistic: true
    restore_value: true

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO13
      inverted: true
      mode:
        input: true
    name: "PIR Sensor 1st step Laser stairs_down"
    device_class: motion
    filters:
      - delayed_on: 200ms
      - delayed_off: 10ms
    on_press:
      then:
        - logger.log:
            level: DEBUG
            format: 'The state of switch: SwitchStairsUpSensorsDisabled is %d'
            args: ['id(SwitchStairsUpSensorsDisabled).state']
        - if:
            condition:
              switch.is_on: SwitchStairsUpSensorsDisabled
            then:
              - logger.log: "[PIR Sensor 1st step Laser stairs_down][on_press], SwitchStairsUpSensorsDisabled is on"
            else:
              - logger.log: "[PIR Sensor 1st step Laser stairs_down][on_press], SwitchStairsUpSensorsDisabled is off"
              - if:
                  condition:
                    script.is_running: script_turn_on_steps_down_to_up
                  then:
                    - logger.log: "[PIR Sensor 1st step Laser stairs_down][on_press], Already running script_turn_on_steps_down_to_up, do not turn on stairs"
                  else:
                    - logger.log: "[PIR Sensor 1st step Laser stairs_down][on_press], Run script.execute"
                    - script.execute: script_turn_on_steps_up_to_down
    on_release:
      then:
        - logger.log:
            level: DEBUG
            format: 'The state of switch: SwitchStairsUpSensorsDisabled is %d'
            args: ['id(SwitchStairsUpSensorsDisabled).state']
        - if:
            condition:
              switch.is_on: SwitchStairsUpSensorsDisabled
            then:
              - logger.log: "[PIR Sensor 1st step Laser stairs_down][on_release], SwitchStairsUpSensorsDisabled is on"
            else:
              - logger.log: "[PIR Sensor 1st step Laser stairs_down][on_release], SwitchStairsUpSensorsDisabled is off"
              - if:
                  condition:
                    script.is_running: script_turn_on_steps_up_to_down
                  then:
                    - logger.log: "[PIR Sensor 1st step Laser stairs_down][on_release], Already running script_turn_on_steps_up_to_down, do not turn off stairs"
                  else:
                    - logger.log: "[PIR Sensor 1st step Laser stairs_down][on_release], Run script.execute"
                    - script.execute: script_turn_off_stairs_up
  - platform: gpio
    pin:
      number: GPIO34
      inverted: false
      mode:
        input: true
    name: "PIR Sensor 16st step stairs_up"
    device_class: motion
    filters:
      - delayed_on: 250ms
      - delayed_off: 10ms
    on_press:
      then:
        - logger.log:
            level: DEBUG
            format: 'The state of switch: SwitchStairsUpSensorsDisabled is %d'
            args: ['id(SwitchStairsUpSensorsDisabled).state']
        - if:
            condition:
              switch.is_on: SwitchStairsUpSensorsDisabled
            then:
              - logger.log: "[PIR Sensor 16st step stairs_up][on_press], SwitchStairsUpSensorsDisabled is on"
            else:
              - logger.log: "[PIR Sensor 16st step stairs_up][on_press], SwitchStairsUpSensorsDisabled is off"
              - if:
                  condition:
                    script.is_running: script_turn_on_steps_up_to_down
                  then:
                    - logger.log: "[PIR Sensor 16st step stairs_up][on_press], Already running script_turn_on_steps_down_to_up, do not turn on stairs"
                  else:
                    - logger.log: "[PIR Sensor 16st step stairs_up][on_press], Run script.execute"
                    - script.execute: script_turn_on_steps_down_to_up
    on_release:
      then:
        - logger.log:
            level: DEBUG
            format: 'The state of switch: SwitchStairsUpSensorsDisabled is %d'
            args: ['id(SwitchStairsUpSensorsDisabled).state']
        - if:
            condition:
              switch.is_on: SwitchStairsUpSensorsDisabled
            then:
              - logger.log: "[PIR Sensor 16st step stairs_up][on_release], SwitchStairsUpSensorsDisabled is on"
            else:
              - logger.log: "[PIR Sensor 16st step stairs_up][on_release], SwitchStairsUpSensorsDisabled is off"
              - if:
                  condition:
                    script.is_running: script_turn_on_steps_down_to_up
                  then:
                    - logger.log: "[PIR Sensor 16st step stairs_up][on_release], Already running script_turn_on_steps_down_to_up, do not turn off stairs"
                  else:
                    - logger.log: "[PIR Sensor 16st step stairs_up][on_release], Run script.execute"
                    - script.execute: script_turn_off_stairs_up

  - platform: gpio
    pin:
      number: GPIO23
      mode:
        input: true
        pulldown: true
    name: "Toggle stairs_up"
    filters:
      - delayed_on_off: 300ms
    on_state:
      then:
        - switch.toggle: SwitchStairsUpSensorsDisabled
        - if:
            condition:
              switch.is_on: SwitchStairsUpSensorsDisabled
            then:
              - logger.log: "[Toggle stairs_up][on_release], SwitchStairsUpSensorsDisabled is on"
              - light.turn_on:
                  id: stairs_up
                  transition_length: 100ms
                  red: !lambda 'return id(stairs_up_red).state;'
                  green: !lambda 'return id(stairs_up_green).state;'
                  blue: !lambda 'return id(stairs_up_blue).state;'
                  brightness: !lambda 'return id(stairs_up_brightness).state;'
            else:
              - logger.log: "[Toggle stairs_up][on_release], SwitchStairsUpSensorsDisabled is off"
              - light.turn_off:
                  id: stairs_up
                  transition_length: 100ms

switch:
  - platform: template
    name: "Disabled sensors for upstairs"
    id: SwitchStairsUpSensorsDisabled
    optimistic: true
  - platform: template
    name: "RunUpToDownOnStairsUp"
    id: RunUpToDownOnStairsUp
    optimistic: true
    turn_on_action:
      - script.execute: script_turn_on_steps_down_to_up
    turn_off_action:
      - script.execute: script_turn_off_stairs_up
  - platform: template
    name: "RunDownToUpOnStairsUp"
    id: RunDownToUpOnStairsUp
    optimistic: true
    turn_on_action:
      - script.execute: script_turn_on_steps_up_to_down
    turn_off_action:
      - script.execute: script_turn_off_stairs_up
  - platform: restart
    name: "Stairs Up Restart"

light:
  - platform: fastled_clockless
    rgb_order: BRG
    chipset: WS2811
    pin: GPIO25
    num_leds: 268
    name: "stairs_up"
    id: stairs_up
    default_transition_length: 300ms
    restore_mode: ALWAYS_OFF
    effects:
      - addressable_rainbow:
      - addressable_color_wipe:
      - addressable_fireworks:
      - addressable_scan:
      - addressable_scan:
          name: Scan Effect With Custom Values
          move_interval: 500ms
          scan_width: 1
  - platform: partition
    id: "stairs_up_step1"
    name: "stairs_up_step1"
    default_transition_length: 300ms
    effects:
      - addressable_rainbow:
      - addressable_scan:
