substitutions:
  default_red: "1.00"
  default_green: "0.87"
  default_blue: "0.50"
  default_brightness: "0.55"
  default_delay_after_animation_s: "20"
  default_animation_delay_up_to_down_ms: "400"
  default_animation_delay_down_to_up_ms: "250"

esphome:
  name: "esp32-stairs-up"
  friendly_name: esp32 Stairs Up

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key_stairs_up

ota:
  platform: esphome
  password: !secret ota_password_stairs_up

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Stairs up Fallback Hotspot"
    password: !secret ap_password_fallback

captive_portal:

# Color and brightness controls — adjustable from HA
number:
  - platform: template
    name: "Stairs Up Red"
    id: stairs_up_red
    min_value: 0
    max_value: 1
    step: 0.01
    initial_value: ${default_red}
    optimistic: true
    restore_value: true
  - platform: template
    name: "Stairs Up Green"
    id: stairs_up_green
    min_value: 0
    max_value: 1
    step: 0.01
    initial_value: ${default_green}
    optimistic: true
    restore_value: true
  - platform: template
    name: "Stairs Up Blue"
    id: stairs_up_blue
    min_value: 0
    max_value: 1
    step: 0.01
    initial_value: ${default_blue}
    optimistic: true
    restore_value: true
  - platform: template
    name: "Stairs Up Brightness"
    id: stairs_up_brightness
    min_value: 0
    max_value: 1
    step: 0.01
    initial_value: ${default_brightness}
    optimistic: true
    restore_value: true
  - platform: template
    name: "Stairs Up Delay After Animation"
    id: delay_after_animation_s
    min_value: 5
    max_value: 60
    step: 1
    unit_of_measurement: "s"
    initial_value: ${default_delay_after_animation_s}
    optimistic: true
    restore_value: true
  - platform: template
    name: "Stairs Up Animation Delay Up To Down"
    id: animation_delay_up_to_down_ms
    min_value: 100
    max_value: 1000
    step: 50
    unit_of_measurement: "ms"
    initial_value: ${default_animation_delay_up_to_down_ms}
    optimistic: true
    restore_value: true
  - platform: template
    name: "Stairs Up Animation Delay Down To Up"
    id: animation_delay_down_to_up_ms
    min_value: 100
    max_value: 1000
    step: 50
    unit_of_measurement: "ms"
    initial_value: ${default_animation_delay_down_to_up_ms}
    optimistic: true
    restore_value: true

binary_sensor:
  - platform: gpio
    id: stairs_up_sensor_first
    pin:
      number: GPIO13
      inverted: true
      mode:
        input: true
    name: "PIR Sensor 1st step Laser stairs_down"
    device_class: motion
    filters:
      - delayed_on: 200ms
      - delayed_off: 10ms
    on_press:
      - script.execute:
          id: stairs_up_request_motion
          down_to_up: false
    on_release:
      - if:
          condition:
            switch.is_off: SwitchStairsUpSensorsDisabled
          then:
            - script.execute: stairs_up_off_timer

  - platform: gpio
    id: stairs_up_sensor_last
    pin:
      number: GPIO34
      inverted: false
      mode:
        input: true
    name: "PIR Sensor 16st step stairs_up"
    device_class: motion
    filters:
      - delayed_on: 250ms
      - delayed_off: 10ms
    on_press:
      - script.execute:
          id: stairs_up_request_motion
          down_to_up: true
    on_release:
      - if:
          condition:
            switch.is_off: SwitchStairsUpSensorsDisabled
          then:
            - script.execute: stairs_up_off_timer

  - platform: gpio
    pin:
      number: GPIO23
      mode:
        input: true
        pulldown: true
    name: "Toggle stairs_up"
    filters:
      - delayed_on_off: 300ms
    # Preserve both-edge behavior for the existing wall switch.
    on_state:
      - switch.toggle: SwitchStairsUpSensorsDisabled

switch:
  - platform: template
    name: "Disabled sensors for upstairs"
    id: SwitchStairsUpSensorsDisabled
    optimistic: true
    on_turn_on:
      - script.execute: script_turn_off_stairs_up
      - light.turn_on:
          id: stairs_up
          transition_length: 100ms
          red: !lambda 'return id(stairs_up_red).state;'
          green: !lambda 'return id(stairs_up_green).state;'
          blue: !lambda 'return id(stairs_up_blue).state;'
          brightness: !lambda 'return id(stairs_up_brightness).state;'
    on_turn_off:
      - script.execute: script_turn_off_stairs_up
      - if:
          condition:
            binary_sensor.is_on: stairs_up_sensor_first
          then:
            - script.execute:
                id: stairs_up_request_motion
                down_to_up: false
          else:
            - if:
                condition:
                  binary_sensor.is_on: stairs_up_sensor_last
                then:
                  - script.execute:
                      id: stairs_up_request_motion
                      down_to_up: true
  - platform: template
    name: "RunUpToDownOnStairsUp"
    id: RunUpToDownOnStairsUp
    optimistic: true
    turn_on_action:
      - script.execute:
          id: stairs_up_request_motion
          down_to_up: true
    turn_off_action:
      - script.execute: script_turn_off_stairs_up
  - platform: template
    name: "RunDownToUpOnStairsUp"
    id: RunDownToUpOnStairsUp
    optimistic: true
    turn_on_action:
      - script.execute:
          id: stairs_up_request_motion
          down_to_up: false
    turn_off_action:
      - script.execute: script_turn_off_stairs_up
  - platform: restart
    name: "Stairs Up Restart"

light:
  - platform: fastled_clockless
    rgb_order: BRG
    chipset: WS2811
    pin: GPIO25
    num_leds: 268
    name: "stairs_up"
    id: stairs_up
    default_transition_length: 300ms
    restore_mode: ALWAYS_OFF
    effects:
      - addressable_rainbow:
      - addressable_color_wipe:
      - addressable_fireworks:
      - addressable_scan:
      - addressable_scan:
