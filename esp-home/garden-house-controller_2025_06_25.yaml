esphome:
  name: garden-house-controller
  friendly_name: Garden House Controller

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

ota:
  platform: esphome
  password: !secret ota_password_garden_controller

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key_garden_house_controller
  services:
    - service: set_multiplier
      variables:
        multiplier: float
      then:
        - sprinkler.set_multiplier:
            id: garden_sprinkler_ctrlr
            multiplier: !lambda |-
              return multiplier;
    - service: start_full_cycle
      then:
        - sprinkler.start_full_cycle: garden_sprinkler_ctrlr
    - service: start_single_valve
      variables:
        valve: int
      then:
        - sprinkler.start_single_valve:
            id: garden_sprinkler_ctrlr
            valve_number: !lambda |-
              return valve;
    - service: next_valve
      then:
        - sprinkler.next_valve: garden_sprinkler_ctrlr
    - service: previous_valve
      then:
        - sprinkler.previous_valve: garden_sprinkler_ctrlr
    - service: shutdown
      then:
        - sprinkler.shutdown: garden_sprinkler_ctrlr

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

switch:
  - platform: gpio
    id: main_section
    name: "Main Section"
    pin: GPIO32
    inverted: true

  - platform: gpio
    id: section_1
    name: "Section 1"
    pin: GPIO33
    inverted: true

  - platform: gpio
    id: section_2
    name: "Section 2"
    pin: GPIO25
    inverted: true

  - platform: gpio
    id: section_3
    name: "Section 3"
    pin: GPIO26
    inverted: true

  - platform: gpio
    id: section_4
    name: "Section 4"
    pin: GPIO27
    inverted: true

  - platform: gpio
    id: section_5
    name: "Section 5"
    pin: GPIO14
    inverted: true

  - platform: gpio
    name: "Garden Switch 1"
    pin: GPIO2
    inverted: true

  - platform: gpio
    name: "Garden Switch 2"
    pin: GPIO15
    inverted: true

sprinkler:
  - id: garden_sprinkler_ctrlr
    main_switch: "Lawn Sprinklers"
    auto_advance_switch: "Lawn Sprinklers Auto Advance"
    reverse_switch: "Lawn Sprinklers Reverse"
    multiplier_number: "Lawn Sprinkler Multiplier"
    valve_open_delay: 5s
    valves:
        - valve_switch: "Section 1"
          enable_switch: "Enable Section 1"
          pump_switch_id: main_section
          # run_duration: 1200s
          run_duration_number:
            name: "Back Yard Section 1 Run Duration"
            id: garden_sprinkler_back_yard_section_1_run_duration
            initial_value: 1200
            unit_of_measurement: s
          valve_switch_id: section_1
        - valve_switch: "Section 2"
          enable_switch: "Enable Section 2"
          pump_switch_id: main_section
          # run_duration: 1200s
          run_duration_number:
            name: "Front Yard Section 2 Run Duration"
            id: garden_sprinkler_front_yard_section_2_run_duration
            initial_value: 1200
            unit_of_measurement: s
          valve_switch_id: section_2
        - valve_switch: "Section 3"
          enable_switch: "Enable Section 3"
          pump_switch_id: main_section
          # run_duration: 1200s
          # run_duration_number: "Back Yard Section 3 Run Duration"
          run_duration_number:
            name: "Back Yard Section 3 Run Duration"
            id: garden_sprinkler_back_yard_section_3_run_duration
            initial_value: 1200
            unit_of_measurement: s
          valve_switch_id: section_3
        - valve_switch: "Section 4"
          enable_switch: "Enable Section 4"
          pump_switch_id: main_section
          # run_duration: 1800s
          # run_duration_number: "Plant Drip line Section 4 Run Duration"
          run_duration_number:
            name: "Plant Drip line Section 4 Run Duration"
            id: garden_sprinkler_plant_drip_line_section_4_run_duration
            initial_value: 1800
            unit_of_measurement: s
          valve_switch_id: section_4
        - valve_switch: "Section 5"
          enable_switch: "Enable Section 5"
          pump_switch_id: main_section
          # run_duration: 1800s
          # run_duration_number: "Vegetables Drip line Section 5 Run Duration"
          run_duration_number:
            name: "Vegetables Drip line Section 5 Run Duration"
            id: garden_sprinkler_vegetables_drip_line_section_5_run_duration
            initial_value: 1800
            unit_of_measurement: s
          valve_switch_id: section_5

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO22
      inverted: true
      mode:
        input: true
        pullup: true
    id: gpio22_sensor
    name: "Garden Sensor Down"
    filters:
      - delayed_off: 50ms
    on_multi_click:
      - timing:
          - ON for at most 1s
          - OFF for at most 1s
          - ON for at most 1s
          - OFF for at least 0.2s
        then:
          - logger.log: "Garden Sensor Down: Double Clicked"
      - timing:
          - ON for 1s to 2s
          - OFF for at least 0.5s
        then:
          - logger.log: "Garden Sensor Down: Single Long Clicked"
      - timing:
          - ON for at most 1s
          - OFF for at least 0.5s
        then:
          - logger.log: "Garden Sensor Down: Single Short Clicked"
  - platform: gpio
    pin:
      number: GPIO19
      inverted: true
      mode:
        input: true
        pullup: true
    id: gpio19_sensor
    name: "Garden Sensor Up"
    filters:
      - delayed_off: 50ms
    on_multi_click:
      - timing:
          - ON for at most 1s
          - OFF for at most 1s
          - ON for at most 1s
          - OFF for at least 0.2s
        then:
          - logger.log: "Garden Sensor Up: Double Clicked"
      - timing:
          - ON for 1s to 2s
          - OFF for at least 0.5s
        then:
          - logger.log: "Garden Sensor Up: Single Long Clicked"
      - timing:
          - ON for at most 1s
          - OFF for at least 0.5s
        then:
          - logger.log: "Garden Sensor Up: Single Short Clicked"

script:
  - id: single_click
    mode: single
    then:
      - logger.log: "Single Click detected"
      # Dodaj akcję dla pojedynczego kliknięcia

  - id: double_click
    mode: single
    then:
      - logger.log: "Double Click detected"
      # Dodaj akcję dla podwójnego kliknięcia

  - id: triple_click
    mode: single
    then:
      - logger.log: "Triple Click detected"
      # Dodaj akcję dla potrójnego kliknięcia

# Optional: Define web server for monitoring
web_server:
  version: 3
  port: 80
  auth:
    username: !secret esp_web_server_username
    password: !secret esp_web_server_password
