esphome:
  name: garden-house-controller
  friendly_name: Garden House Controller

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

ota:
  platform: esphome
  password: !secret ota_password_garden_controller

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key_garden_house_controller
  # services:
  #   - service: press_button
  #     variables:
  #       id: string
  #     then:
  #       - button.press: !lambda 'return id(id);'

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

switch:
  - platform: gpio
    id: main_section
    name: "Main Section"
    pin: GPIO32
    inverted: true

  - platform: gpio
    id: section_1
    name: "Section 1"
    pin: GPIO33
    inverted: true

  - platform: gpio
    id: section_2
    name: "Section 2"
    pin: GPIO25
    inverted: true

  - platform: gpio
    id: section_3
    name: "Section 3"
    pin: GPIO26
    inverted: true

  - platform: gpio
    id: section_4
    name: "Section 4"
    pin: GPIO27
    inverted: true

  - platform: gpio
    id: section_5
    name: "Section 5"
    pin: GPIO14
    inverted: true

  - platform: gpio
    name: "Garden Switch 1"
    pin: GPIO2
    inverted: true

  - platform: gpio
    name: "Garden Switch 2"
    pin: GPIO15
    inverted: true

sprinkler:
  - id: garden_sprinkler_ctrlr
    main_switch: "Lawn Sprinklers"
    auto_advance_switch: "Lawn Sprinklers Auto Advance"
    reverse_switch: "Lawn Sprinklers Reverse"
    valve_open_delay: 5s
    valves:
        - valve_switch: "Section 1"
          enable_switch: "Enable Section 1"
          pump_switch_id: main_section
          run_duration: 10s
          valve_switch_id: section_1
        - valve_switch: "Section 2"
          enable_switch: "Enable Section 2"
          pump_switch_id: main_section
          run_duration: 10s
          valve_switch_id: section_2
        - valve_switch: "Section 3"
          enable_switch: "Enable Section 3"
          pump_switch_id: main_section
          run_duration: 10s
          valve_switch_id: section_3
        - valve_switch: "Section 4"
          enable_switch: "Enable Section 4"
          pump_switch_id: main_section
          run_duration: 12s
          valve_switch_id: section_4
        - valve_switch: "Section 5"
          enable_switch: "Enable Section 5"
          pump_switch_id: main_section
          run_duration: 12s
          valve_switch_id: section_5

binary_sensor:
  - platform: gpio
    name: "contracton"
    pin:
      number: GPIO23
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms
  - platform: gpio
    pin:
      number: GPIO22
      inverted: true
      mode:
        input: true
        pullup: true
    id: gpio22_button
    name: "Button"
    on_press:
      then:
        - script.execute: handle_button_press
    on_release:
      then:
        - script.execute: handle_button_release
    # filters:
    #   - delayed_on: 10ms
    #   - delayed_off: 10ms

# Skrypt obsługujący różne typy naciśnięć
script:
  - id: handle_button_press
    mode: restart
    then:
      - globals.set:
          id: last_press_time
          value: !lambda 'return millis();'
      - delay: 600ms
      - if:
          condition:
            lambda: 'return (millis() - id(last_press_time)) < 600;'
          then:
            - globals.set:
                id: press_count
                value: !lambda 'return id(press_count) + 1;'
      - if:
          condition:
            lambda: 'return id(press_count) == 1;'
          then:
            - lambda: |-
                ESP_LOGD("custom", "Single press detected");
                // Replace with your action for single press
      - if:
          condition:
            lambda: 'return id(press_count) == 2;'
          then:
            - lambda: |-
                ESP_LOGD("custom", "Double press detected");
                // Replace with your action for double press
      - if:
          condition:
            lambda: 'return id(press_count) == 3;'
          then:
            - lambda: |-
                ESP_LOGD("custom", "Triple press detected");
                // Replace with your action for triple press
            - globals.set:
                id: press_count
                value: '0'

  - id: handle_button_release
    mode: restart
    then:
      - delay: 700ms
      - if:
          condition:
            lambda: 'return id(press_count) == 0;'
          then:
            - lambda: |-
                ESP_LOGD("custom", "Long press detected");
                // Replace with your action for long press


