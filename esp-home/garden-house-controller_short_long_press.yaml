# Zmienna globalna do zliczania naciśnięć
globals:
  - id: press_count
    type: int
    restore_value: no
    initial_value: '0'
  - id: last_press_time
    type: float
    restore_value: no
    initial_value: '0.0'

# Optional: Define web server for monitoring
web_server:
  version: 3
  port: 80
  auth:
    username: !secret esp_web_server_username
    password: !secret esp_web_server_password
