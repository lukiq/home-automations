esphome:
  name: esp32-ble-tracker
  friendly_name: esp32-ble-tracker

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret ble_tracker_api_key
  on_client_connected:
    - esp32_ble_tracker.start_scan:
       continuous: true
  on_client_disconnected:
    - esp32_ble_tracker.stop_scan:

ota:
  - platform: esphome
    password: !secret ble_tracker_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Enable Bluetooth Proxy
esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true
  on_ble_advertise:
    then:
      - lambda: |-
          ESP_LOGD("ble_adv", "Device found: %s", x.c_str());
  on_scan_end:
    - then:
        - lambda: |-
             ESP_LOGD("ble_auto", "The scan has ended!");

bluetooth_proxy:
  active: true
