binary_sensor:
  - platform: gpio
    pin:
      number: GPIO22
      inverted: true
      mode:
        input: true
        pullup: true
    id: gpio22_sensor
    name: "Garden Sensor Down"
    filters:
      - delayed_off: 50ms
    on_multi_click:
      - timing:
          - ON for at most 1s
          - OFF for at least 0.5s
        then:
          - logger.log: "Button DOWN: short → previous valve"
          - sprinkler.previous_valve: garden_sprinkler_ctrlr
      - timing:
          - ON for 1s to 2s
          - OFF for at least 0.5s
        then:
          - logger.log: "Button DOWN: long → shutdown"
          - sprinkler.shutdown: garden_sprinkler_ctrlr
  - platform: gpio
    pin:
      number: GPIO19
      inverted: true
      mode:
        input: true
        pullup: true
    id: gpio19_sensor
    name: "Garden Sensor Up"
    filters:
      - delayed_off: 50ms
    on_multi_click:
      - timing:
          - ON for at most 1s
          - OFF for at least 0.5s
        then:
          - logger.log: "Button UP: short → next valve"
          - sprinkler.next_valve: garden_sprinkler_ctrlr
      - timing:
          - ON for 1s to 2s
          - OFF for at least 0.5s
        then:
          - logger.log: "Button UP: long → shutdown"
          - sprinkler.shutdown: garden_sprinkler_ctrlr

# Optional: Define web server for monitoring
web_server:
  version: 3
  port: 80
  auth:
    username: !secret esp_web_server_username
    password: !secret esp_web_server_password
