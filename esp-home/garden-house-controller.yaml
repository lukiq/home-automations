          int t = (int)id(section_2_parallel).state;
          if (t < 1 || t > 5 || t == 2) return;
          bool keep = (t == (int)id(section_1_parallel).state && id(section_1).state) ||
                      (t == (int)id(section_3_parallel).state && id(section_3).state) ||
                      (t == (int)id(section_4_parallel).state && id(section_4).state) ||
                      (t == (int)id(section_5_parallel).state && id(section_5).state);
          if (keep) return;
          if (t == 1) id(section_1).turn_off();
          else if (t == 3) id(section_3).turn_off();
          else if (t == 4) id(section_4).turn_off();
          else if (t == 5) id(section_5).turn_off();

  - platform: gpio
    id: section_3
    name: "Section 3"
    pin: GPIO26
    inverted: true
    internal: true
    on_turn_on:
      - logger.log: "Section 3: OPEN"
