    on_turn_off:
      - logger.log: "Section 4: CLOSED"
      - lambda: |-
          int t = (int)id(section_4_parallel).state;
          if (t < 1 || t > 5 || t == 4) return;
          bool keep = (t == (int)id(section_1_parallel).state && id(section_1).state) ||
                      (t == (int)id(section_2_parallel).state && id(section_2).state) ||
                      (t == (int)id(section_3_parallel).state && id(section_3).state) ||
                      (t == (int)id(section_5_parallel).state && id(section_5).state);
          if (keep) return;
          if (t == 1) id(section_1).turn_off();
          else if (t == 2) id(section_2).turn_off();
