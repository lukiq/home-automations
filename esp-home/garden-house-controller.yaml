  - platform: gpio
    id: section_5
    name: "Section 5"
    pin: GPIO14
    inverted: true
    internal: true
    on_turn_on:
      - logger.log: "Section 5: OPEN"
      - lambda: |-
          int t = (int)id(section_5_parallel).state;
          if (t < 1 || t > 5 || t == 5) return;
