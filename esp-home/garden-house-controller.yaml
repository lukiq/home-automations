esphome:
  name: garden-house-controller
  friendly_name: Garden House Controller
  on_boot:
    priority: -100
    then:
      # Keep existing HA section switches reporting physical valves, including companions.
      - lambda: |-
          id(section_1_control).set_state_lambda([]() -> esphome::optional<bool> {
            return id(section_1).state && id(main_section).state;
          });
          id(section_2_control).set_state_lambda([]() -> esphome::optional<bool> {
            return id(section_2).state && id(main_section).state;
          });
          id(section_3_control).set_state_lambda([]() -> esphome::optional<bool> {
            return id(section_3).state && id(main_section).state;
          });
          id(section_4_control).set_state_lambda([]() -> esphome::optional<bool> {
            return id(section_4).state && id(main_section).state;
          });
          id(section_5_control).set_state_lambda([]() -> esphome::optional<bool> {
            return id(section_5).state && id(main_section).state;
          });

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

ota:
  platform: esphome
  password: !secret ota_password_garden_controller

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key_garden_house_controller
  services:
    - service: set_multiplier
      variables:
        multiplier: float
      then:
        - sprinkler.set_multiplier:
            id: garden_sprinkler_ctrlr
            multiplier: !lambda |-
              return multiplier;
    - service: start_full_cycle
      then:
        - sprinkler.start_full_cycle: garden_sprinkler_ctrlr
    - service: start_single_valve
      variables:
        valve: int
      then:
        - sprinkler.start_single_valve:
            id: garden_sprinkler_ctrlr
            valve_number: !lambda |-
              return valve;
    - service: next_valve
      then:
        - sprinkler.next_valve: garden_sprinkler_ctrlr
    - service: previous_valve
      then:
        - sprinkler.previous_valve: garden_sprinkler_ctrlr
    - service: shutdown
      then:
        - sprinkler.shutdown: garden_sprinkler_ctrlr

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Garden-Controller"
    password: !secret esp_web_server_password

captive_portal:

# A long press must not also run the short action at the timing boundary.
globals:
  - id: garden_down_long_press
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: garden_up_long_press
    type: bool
    restore_value: false
    initial_value: 'false'

switch:
  - platform: gpio
    id: main_section
    name: "Main Section"
    pin: GPIO32
    inverted: true
    internal: true
    on_turn_on:
      - logger.log: "Main valve: OPEN"
    on_turn_off:
      - logger.log: "Main valve: CLOSED"

  - platform: gpio
    id: section_1
    name: "Section 1"
    pin: GPIO33
    inverted: true
    internal: true
    on_turn_on:
      - logger.log: "Section 1: OPEN"
    on_turn_off:
      - logger.log: "Section 1: CLOSED"

  - platform: gpio
    id: section_2
    name: "Section 2"
    pin: GPIO25
    inverted: true
    internal: true
    on_turn_on:
      - logger.log: "Section 2: OPEN"
    on_turn_off:
      - logger.log: "Section 2: CLOSED"

  - platform: gpio
    id: section_3
    name: "Section 3"
    pin: GPIO26
    inverted: true
    internal: true
    on_turn_on:
      - logger.log: "Section 3: OPEN"
    on_turn_off:
      - logger.log: "Section 3: CLOSED"

  - platform: gpio
    id: section_4
    name: "Section 4"
    pin: GPIO27
    inverted: true
    internal: true
    on_turn_on:
      - logger.log: "Section 4: OPEN"
    on_turn_off:
      - logger.log: "Section 4: CLOSED"

  - platform: gpio
    id: section_5
    name: "Section 5"
    pin: GPIO14
    inverted: true
    internal: true
    on_turn_on:
      - logger.log: "Section 5: OPEN"
    on_turn_off:
      - logger.log: "Section 5: CLOSED"

  # Sprinkler owns these requests; only the reconciler writes physical valves.
  - platform: template
    id: section_1_request
    internal: true
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_state:
      - script.execute: garden_reconcile_valves

  - platform: template
    id: section_2_request
    internal: true
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_state:
      - script.execute: garden_reconcile_valves

  - platform: template
    id: section_3_request
    internal: true
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_state:
      - script.execute: garden_reconcile_valves

  - platform: template
    id: section_4_request
    internal: true
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_state:
      - script.execute: garden_reconcile_valves

  - platform: template
    id: section_5_request
    internal: true
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_state:
      - script.execute: garden_reconcile_valves

  - platform: gpio
    name: "Garden Switch 1"
    pin: GPIO2
    inverted: true

  - platform: gpio
    name: "Garden Switch 2"
    pin: GPIO15
    inverted: true

sprinkler:
  - id: garden_sprinkler_ctrlr
    main_switch: "Lawn Sprinklers"
    auto_advance_switch: "Lawn Sprinklers Auto Advance"
    reverse_switch: "Lawn Sprinklers Reverse"
    multiplier_number: "Lawn Sprinkler Multiplier"
    standby_switch: "Lawn Sprinklers Rain Delay"
    manual_selection_delay: 2s
    valve_overlap: 5s
    valves:
        - valve_switch:
            name: "Section 1"
            id: section_1_control
          enable_switch: "Enable Section 1"
          pump_switch_id: main_section
          # run_duration: 1200s
          run_duration_number:
            name: "Back Yard Section 1 Run Duration"
            id: garden_sprinkler_back_yard_section_1_run_duration
            initial_value: 1200
            unit_of_measurement: s
          valve_switch_id: section_1_request
        - valve_switch:
            name: "Section 2"
            id: section_2_control
          enable_switch: "Enable Section 2"
          pump_switch_id: main_section
          # run_duration: 1200s
          run_duration_number:
            name: "Front Yard Section 2 Run Duration"
            id: garden_sprinkler_front_yard_section_2_run_duration
            initial_value: 1200
            unit_of_measurement: s
          valve_switch_id: section_2_request
        - valve_switch:
            name: "Section 3"
            id: section_3_control
          enable_switch: "Enable Section 3"
          pump_switch_id: main_section
          # run_duration: 1200s
          # run_duration_number: "Back Yard Section 3 Run Duration"
          run_duration_number:
            name: "Back Yard Section 3 Run Duration"
            id: garden_sprinkler_back_yard_section_3_run_duration
            initial_value: 1200
            unit_of_measurement: s
          valve_switch_id: section_3_request
        - valve_switch:
            name: "Section 4"
            id: section_4_control
          enable_switch: "Enable Section 4"
          pump_switch_id: main_section
          # run_duration: 1800s
          # run_duration_number: "Plant Drip line Section 4 Run Duration"
          run_duration_number:
            name: "Plant Drip line Section 4 Run Duration"
            id: garden_sprinkler_plant_drip_line_section_4_run_duration
            initial_value: 1800
            unit_of_measurement: s
          valve_switch_id: section_4_request
        - valve_switch:
            name: "Section 5"
            id: section_5_control
          enable_switch: "Enable Section 5"
          pump_switch_id: main_section
          # run_duration: 1800s
          # run_duration_number: "Vegetables Drip line Section 5 Run Duration"
          run_duration_number:
            name: "Vegetables Drip line Section 5 Run Duration"
            id: garden_sprinkler_vegetables_drip_line_section_5_run_duration
            initial_value: 1800
            unit_of_measurement: s
          valve_switch_id: section_5_request

number:
  - platform: template
    name: "Section 1 Parallel Section"
    id: section_1_parallel
    min_value: 0
    max_value: 5
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - script.execute: garden_reconcile_valves
  - platform: template
    name: "Section 2 Parallel Section"
    id: section_2_parallel
    min_value: 0
    max_value: 5
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - script.execute: garden_reconcile_valves
  - platform: template
    name: "Section 3 Parallel Section"
    id: section_3_parallel
    min_value: 0
    max_value: 5
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - script.execute: garden_reconcile_valves
  - platform: template
    name: "Section 4 Parallel Section"
    id: section_4_parallel
    min_value: 0
    max_value: 5
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - script.execute: garden_reconcile_valves
  - platform: template
    name: "Section 5 Parallel Section"
    id: section_5_parallel
    min_value: 0
