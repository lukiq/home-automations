binary_sensor:
  - platform: gpio
    pin:
      number: GPIO22
      inverted: true
      mode:
        input: true
        pullup: true
    id: gpio22_sensor
    name: "Garden Sensor Down"
    filters:
      - delayed_off: 50ms
    on_press:
      - globals.set:
          id: garden_down_long_press
          value: 'false'
    on_multi_click:
      - timing:
          - ON for at most 1s
          - OFF for at least 0.5s
        then:
          - if:
              condition:
                lambda: 'return !id(garden_down_long_press);'
              then:
                - logger.log: "Button DOWN: short -> previous valve"
                - sprinkler.previous_valve: garden_sprinkler_ctrlr
      - timing:
          - ON for at least 1s
        then:
          - globals.set:
              id: garden_down_long_press
              value: 'true'
          - logger.log: "Button DOWN: held -> shutdown"
          - sprinkler.shutdown: garden_sprinkler_ctrlr
  - platform: gpio
    pin:
      number: GPIO19
      inverted: true
      mode:
        input: true
        pullup: true
    id: gpio19_sensor
    name: "Garden Sensor Up"
    filters:
      - delayed_off: 50ms
    on_press:
      - globals.set:
          id: garden_up_long_press
          value: 'false'
    on_multi_click:
      - timing:
          - ON for at most 1s
          - OFF for at least 0.5s
        then:
          - if:
              condition:
                lambda: 'return !id(garden_up_long_press);'
              then:
                - logger.log: "Button UP: short -> next valve"
                - sprinkler.next_valve: garden_sprinkler_ctrlr
      - timing:
          - ON for at least 1s
        then:
          - globals.set:
              id: garden_up_long_press
              value: 'true'
          - logger.log: "Button UP: held -> shutdown"
          - sprinkler.shutdown: garden_sprinkler_ctrlr

script:
  - id: garden_reconcile_valves
    mode: single
    then:
      - lambda: |-
          const bool requested[] = {
            id(section_1_request).state, id(section_2_request).state,
            id(section_3_request).state, id(section_4_request).state,
            id(section_5_request).state
          };
          const float parallel[] = {
            id(section_1_parallel).state, id(section_2_parallel).state,
            id(section_3_parallel).state, id(section_4_parallel).state,
            id(section_5_parallel).state
          };
          esphome::switch_::Switch *outputs[] = {
            id(section_1), id(section_2), id(section_3),
            id(section_4), id(section_5)
          };
          bool wanted[5] = {};
          for (size_t source = 0; source < 5; source++) {
            if (!requested[source]) continue;
            size_t section = source;
            // Shared paths stop at visited nodes; cycles cannot keep themselves on.
            while (!wanted[section]) {
              wanted[section] = true;
              const float target = parallel[section];
              // Restored numbers can be unknown during startup. Check before casting.
              if (!std::isfinite(target) || target < 1 || target > 5 ||
                  target != std::floor(target)) break;
              section = static_cast<size_t>(target) - 1;
            }
          }
          // Establish new paths before closing old ones during live remapping.
          for (size_t i = 0; i < 5; i++) {
            if (wanted[i] && !outputs[i]->state) outputs[i]->turn_on();
          }
          for (size_t i = 0; i < 5; i++) {
            if (!wanted[i] && outputs[i]->state) outputs[i]->turn_off();
          }

# Optional: Define web server for monitoring
web_server:
  version: 3
  port: 80
  auth:
    username: !secret esp_web_server_username
    password: !secret esp_web_server_password
