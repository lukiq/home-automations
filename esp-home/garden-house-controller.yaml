esphome:
  name: garden-house-controller
  friendly_name: Garden House Controller

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

ota:
  platform: esphome
  password: !secret ota_password_garden_controller

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key_garden_house_controller
  services:
    - service: set_multiplier
      variables:
        multiplier: float
      then:
        - sprinkler.set_multiplier:
            id: garden_sprinkler_ctrlr
            multiplier: !lambda |-
              return multiplier;
    - service: start_full_cycle
      then:
        - sprinkler.start_full_cycle: garden_sprinkler_ctrlr
    - service: start_single_valve
      variables:
        valve: int
      then:
        - sprinkler.start_single_valve:
            id: garden_sprinkler_ctrlr
            valve_number: !lambda |-
              return valve;
    - service: next_valve
      then:
        - sprinkler.next_valve: garden_sprinkler_ctrlr
    - service: previous_valve
      then:
        - sprinkler.previous_valve: garden_sprinkler_ctrlr
    - service: shutdown
      then:
        - sprinkler.shutdown: garden_sprinkler_ctrlr

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Garden-Controller"
    password: !secret esp_web_server_password

captive_portal:

switch:
  - platform: gpio
    id: main_section
    name: "Main Section"
    pin: GPIO32
    inverted: true
    internal: true
    on_turn_on:
      - logger.log: "Pump: ON"
    on_turn_off:
      - logger.log: "Pump: OFF"

  - platform: gpio
    id: section_1
    name: "Section 1"
    pin: GPIO33
    inverted: true
    internal: true
    on_turn_on:
      - logger.log: "Section 1: OPEN"
      - lambda: |-
          int t = (int)id(section_1_parallel).state;
          if (t < 1 || t > 5 || t == 1) return;
          if (t == 2) id(section_2).turn_on();
          else if (t == 3) id(section_3).turn_on();
          else if (t == 4) id(section_4).turn_on();
          else if (t == 5) id(section_5).turn_on();
    on_turn_off:
      - logger.log: "Section 1: CLOSED"
      - lambda: |-
          int t = (int)id(section_1_parallel).state;
          if (t < 1 || t > 5 || t == 1) return;
          bool keep = (t == (int)id(section_2_parallel).state && id(section_2).state) ||
                      (t == (int)id(section_3_parallel).state && id(section_3).state) ||
                      (t == (int)id(section_4_parallel).state && id(section_4).state) ||
                      (t == (int)id(section_5_parallel).state && id(section_5).state);
          if (keep) return;
          if (t == 2) id(section_2).turn_off();
          else if (t == 3) id(section_3).turn_off();
          else if (t == 4) id(section_4).turn_off();
          else if (t == 5) id(section_5).turn_off();

  - platform: gpio
    id: section_2
    name: "Section 2"
    pin: GPIO25
    inverted: true
    internal: true
    on_turn_on:
      - logger.log: "Section 2: OPEN"
      - lambda: |-
          int t = (int)id(section_2_parallel).state;
          if (t < 1 || t > 5 || t == 2) return;
          if (t == 1) id(section_1).turn_on();
          else if (t == 3) id(section_3).turn_on();
          else if (t == 4) id(section_4).turn_on();
          else if (t == 5) id(section_5).turn_on();
    on_turn_off:
      - logger.log: "Section 2: CLOSED"
